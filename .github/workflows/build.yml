name: Build & Deploy to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup dependencies
        run: |
          brew install dpkg ldid

      # =========================
      # BUILD AppDataManager
      # =========================
      - name: Build AppDataManager
        run: |
          make clean
          make package
        working-directory: ${{ github.workspace }}

      - name: Verify AppDataManager package
        run: |
          ls -la packages/
          file packages/*.deb

      # =========================
      # BUILD IPA Installer Pro
      # =========================
      - name: Build IPA Installer Pro
        run: |
          cd IPAInstallerPro
          make clean
          make package

      - name: Verify IPA Installer Pro package
        run: |
          ls -la IPAInstallerPro/packages/
          file IPAInstallerPro/packages/*.deb

      # =========================
      # DEPLOY BOTH to gh-pages
      # =========================
      - name: Deploy to gh-pages
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"

          # Fetch gh-pages
          git fetch origin gh-pages || true

          # Create orphan if not exists
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Clean everything except .git
          git rm -rf . 2>/dev/null || true
          rm -rf * 2>/dev/null || true

          # Create pool directory
          mkdir -p pool/main/iphoneos-arm64

          # Copy both .debs
          cp packages/*.deb pool/main/iphoneos-arm64/ 2>/dev/null || true
          cp IPAInstallerPro/packages/*.deb pool/main/iphoneos-arm64/ 2>/dev/null || true

          # Generate Packages metadata
          python3 scripts/generate-repo.py .

          # Generate Release file
          cat > Release <<EOF
Origin: A-ZAIN Repo
Label: A-ZAIN
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm64
Components: main
Description: A-ZAIN Repo - Jailbreak tools and utilities
EOF

          # Commit and push
          git add -A
          git commit -m "Update repo: AppDataManager + IPA Installer Pro" || true
          git push origin gh-pages --force
