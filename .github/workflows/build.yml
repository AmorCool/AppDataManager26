name: Build AppData Manager

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Build iOS Package
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "Runner: $(uname -a)"
          echo "Xcode: $(xcode-select -p)"
          clang --version | head -1
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Install dependencies
        run: |
          brew install ldid dpkg
          which ldid
          which dpkg-deb

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-theos-v1

      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Verify Theos
        run: |
          test -f "$THEOS/makefiles/common.mk" || exit 1
          test -f "$THEOS/makefiles/package/deb.mk" || exit 1
          echo "Theos OK"

      - name: Install libroot
        run: |
          git clone --depth 1 https://github.com/opa334/libroot.git /tmp/libroot || true
          if [ -f /tmp/libroot/include/rootless.h ]; then
            cp /tmp/libroot/include/rootless.h "$THEOS/include/"
            echo "libroot installed from GitHub"
          elif [ -f ${{ github.workspace }}/rootless.h ]; then
            cp ${{ github.workspace }}/rootless.h "$THEOS/include/rootless.h"
            echo "libroot installed from local stub"
          else
            echo "WARNING: No rootless.h found"
          fi
          test -f "$THEOS/include/rootless.h" && echo "rootless.h OK" || echo "rootless.h MISSING"

      - name: Fix permissions
        run: |
          chmod +x layout/DEBIAN/postinst
          chmod +x layout/DEBIAN/prerm

      - name: Build package
        run: |
          export PATH="$THEOS/bin:$PATH"
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Verify build output
        run: |
          DEB_FILE=$(ls -t packages/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "BUILD FAILED: No .deb found"
            ls -la packages/ 2>/dev/null || true
            exit 1
          fi
          echo "Package: $DEB_FILE"
          dpkg-deb -I "$DEB_FILE"
          dpkg-deb -c "$DEB_FILE" | head -20

      - name: Build repo
        run: |
          DEB_FILE=$(ls -t packages/*.deb 2>/dev/null | head -1)
          DEB_BASENAME=$(basename "$DEB_FILE")
          DEB_SIZE=$(stat -f%z "$DEB_FILE")
          DEB_MD5=$(md5 -q "$DEB_FILE")
          DEB_SHA256=$(shasum -a 256 "$DEB_FILE" | awk '{print $1}')

          mkdir -p repo/pool/main/iphoneos-arm64
          cp "$DEB_FILE" "repo/pool/main/iphoneos-arm64/$DEB_BASENAME"

          cd repo
          dpkg-deb -I "../$DEB_FILE" > Packages
          echo "" >> Packages
          echo "Filename: pool/main/iphoneos-arm64/$DEB_BASENAME" >> Packages
          echo "Size: $DEB_SIZE" >> Packages
          echo "MD5sum: $DEB_MD5" >> Packages
          echo "SHA256: $DEB_SHA256" >> Packages

          bzip2 -k -c Packages > Packages.bz2
          xz -c Packages > Packages.xz

          cat Packages
          cd ..

      - name: Verify repo
        run: |
          test -f repo/Packages || exit 1
          test -f repo/Packages.bz2 || exit 1
          test -f repo/Packages.xz || exit 1
          test -f repo/Release || exit 1
          test -f repo/pool/main/iphoneos-arm64/*.deb || exit 1
          grep -q "Size: 0" repo/Packages && exit 1 || true
          echo "Repo OK"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appdata-manager-build
          path: |
            packages/*.deb
            repo/
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          DEB_FILE=$(ls -t packages/*.deb 2>/dev/null | head -1)
          echo "BUILD SUCCESS"
          echo "Package: $(basename $DEB_FILE)"
          echo "Size: $(stat -f%z "$DEB_FILE") bytes"
