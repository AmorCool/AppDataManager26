name: Build IPA Installer Pro

on:
  push:
    branches: [main]
    paths:
      - 'IPAInstallerPro/**'
      - '.github/workflows/build-ipainstaller.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup dependencies
        run: brew install dpkg ldid

      - name: Build IPA Installer Pro
        run: |
          cd source/IPAInstallerPro
          make clean
          make package

      - name: Verify package
        run: |
          ls -la source/IPAInstallerPro/packages/
          file source/IPAInstallerPro/packages/*.deb

      - name: Deploy to gh-pages
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"

          # Copy new .deb to repo pool
          mkdir -p repo/pool/main/iphoneos-arm64
          cp source/IPAInstallerPro/packages/*.deb repo/pool/main/iphoneos-arm64/

          # Regenerate Packages metadata
          cd repo
          python3 ../source/scripts/generate-repo.py .

          # Update Release file
          cat > Release <<'EOF'
Origin: A-ZAIN Repo
Label: A-ZAIN
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm64
Components: main
Description: A-ZAIN Repo - Jailbreak tools and utilities
EOF

          # Commit and push
          git add -A
          git commit -m "Add IPA Installer Pro package" || true
          git push origin gh-pages
