name: Build IPA Installer Pro

on:
  push:
    paths:
      - 'IPAInstallerPro/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup dependencies
        run: |
          brew install dpkg ldid

      - name: Build IPA Installer Pro
        run: |
          cd IPAInstallerPro
          make clean
          make package

      - name: Verify package
        run: |
          ls -la IPAInstallerPro/packages/
          file IPAInstallerPro/packages/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPAInstallerPro-deb
          path: IPAInstallerPro/packages/*.deb

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"
          git fetch origin gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages
          mkdir -p pool/main/iphoneos-arm64
          cp IPAInstallerPro/packages/*.deb pool/main/iphoneos-arm64/
          git add pool/
          git commit -m "Add IPA Installer Pro build" || true
          git push origin gh-pages
