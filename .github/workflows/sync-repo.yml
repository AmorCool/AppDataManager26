name: Auto Sync Repo

on:
  workflow_run:
    workflows: ["Build & Deploy to gh-pages"]
    types:
      - completed

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: aosaid3224-ops/repo
          token: ${{ secrets.REPO_TOKEN }}
          path: repo

      - name: Download latest .debs from gh-pages
        run: |
          mkdir -p repo/pool/main/iphoneos-arm64

          # Download AppDataManager
          ADM_DEB=$(curl -s https://api.github.com/repos/aosaid3224-ops/AppDataManager/contents/gh-pages/pool/main/iphoneos-arm64?ref=gh-pages | grep -o '"name":"[^"]*appdatamgr[^"]*"' | head -1 | sed 's/"name":"//;s/"$//')
          if [ -n "$ADM_DEB" ]; then
            wget -q "https://raw.githubusercontent.com/aosaid3224-ops/AppDataManager/gh-pages/pool/main/iphoneos-arm64/${ADM_DEB}" -O "repo/pool/main/iphoneos-arm64/${ADM_DEB}" || true
          fi

          # Download IPA Installer Pro
          IPA_DEB=$(curl -s https://api.github.com/repos/aosaid3224-ops/AppDataManager/contents/gh-pages/pool/main/iphoneos-arm64?ref=gh-pages | grep -o '"name":"[^"]*ipainstallerpro[^"]*"' | head -1 | sed 's/"name":"//;s/"$//')
          if [ -n "$IPA_DEB" ]; then
            wget -q "https://raw.githubusercontent.com/aosaid3224-ops/AppDataManager/gh-pages/pool/main/iphoneos-arm64/${IPA_DEB}" -O "repo/pool/main/iphoneos-arm64/${IPA_DEB}" || true
          fi

          ls -la repo/pool/main/iphoneos-arm64/

      - name: Generate repo metadata
        run: |
          cd repo
          python3 ../scripts/generate-repo.py .

          cat > Release <<EOF
Origin: A-ZAIN Repo
Label: A-ZAIN
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm64
Components: main
Description: A-ZAIN Repo - Jailbreak tools and utilities
EOF

      - name: Validate repository
        run: |
          cd repo
          python3 ../scripts/validate-repo.py .

      - name: Commit and push
        run: |
          cd repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Auto-sync: AppDataManager + IPA Installer Pro" || true
          git push
