name: Release to Production

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repo-dev to repo (production)
        run: |
          # نسخ AppData Manager فقط إلى repo (الإنتاج)
          # IPA Installer Pro يبقى في repo-dev فقط
          python3 scripts/generate-repo.py repo --prod
          python3 scripts/validate-repo.py repo

      - name: Commit and push production
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add repo/
          git diff --cached --quiet || git commit -m "🚀 Release to production $(date +%Y-%m-%d-%H:%M)"
          git push origin main

      - name: Create release tag
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          git tag -a "v$VERSION" -m "Production release $VERSION"
          git push origin "v$VERSION"
