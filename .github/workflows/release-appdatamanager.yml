name: Release AppData Manager to Production

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.4.1)'
        required: true
        default: '1.4.1'
      confirm:
        description: 'Type YES to confirm production release'
        required: true
        default: 'NO'

jobs:
  release:
    if: github.event.inputs.confirm == 'YES'
    runs-on: macos-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "YES" ]; then
            echo "❌ Release cancelled. Type YES to confirm."
            exit 1
          fi
          echo "✅ Confirmed. Proceeding with AppData Manager production release..."

      - name: Checkout AppDataManager source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout repo (production)
        uses: actions/checkout@v4
        with:
          repository: aosaid3224-ops/repo
          token: ${{ secrets.PAT }}
          path: repo

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg ldid

      - name: Build AppData Manager
        run: |
          cd source
          make clean
          make package

      - name: Verify build
        run: |
          ls -la source/packages/
          echo "✅ AppData Manager build verified!"

      - name: Copy generate-repo.py to repo
        run: |
          mkdir -p repo/scripts
          cp source/scripts/generate-repo.py repo/scripts/

      - name: Deploy to production repo
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"

          mkdir -p repo/pool/main/iphoneos-arm64
          cp source/packages/*.deb repo/pool/main/iphoneos-arm64/

          cd repo
          python3 scripts/generate-repo.py . --prod

          git add -A
          git commit -m "Release AppData Manager v${{ github.event.inputs.version }}" || true
          git push origin main

      - name: Success notification
        run: |
          echo "🎉 AppData Manager v${{ github.event.inputs.version }} released to production!"
          echo "🔗 https://aosaid3224-ops.github.io/repo/"
