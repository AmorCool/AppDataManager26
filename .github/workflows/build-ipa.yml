name: Build IPA Installer Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup dependencies
        run: brew install dpkg ldid

      - name: Fix postinst permissions
        run: chmod +x IPAInstallerPro/layout/DEBIAN/postinst

      - name: Build IPA Installer Pro
        run: |
          cd IPAInstallerPro
          make clean
          make package

      - name: List packages
        run: |
          echo "=== Root packages ==="
          ls -la packages/ 2>/dev/null || echo 'No root packages'
          echo "=== IPAInstallerPro packages ==="
          ls -la IPAInstallerPro/packages/ 2>/dev/null || echo 'No IPAInstallerPro packages'
          echo "=== Find all .debs ==="
          find . -name '*.deb' -type f

      - name: Deploy to gh-pages
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"

          # Save new .deb and scripts before switching branches
          mkdir -p /tmp/deploy
          find . -name '*.deb' -type f -exec cp {} /tmp/deploy/ \;
          cp -r scripts /tmp/deploy/scripts

          git fetch origin gh-pages || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Preserve existing .debs in pool
          mkdir -p pool/main/iphoneos-arm64
          git checkout gh-pages -- pool/main/iphoneos-arm64/*.deb 2>/dev/null || true

          # Copy new .deb
          cp /tmp/deploy/*.deb pool/main/iphoneos-arm64/

          # Regenerate Packages with ALL .debs
          python3 /tmp/deploy/scripts/generate-repo.py .

          echo "Origin: A-ZAIN Repo" > Release
          echo "Label: A-ZAIN" >> Release
          echo "Suite: stable" >> Release
          echo "Version: 1.0" >> Release
          echo "Codename: ios" >> Release
          echo "Architectures: iphoneos-arm64" >> Release
          echo "Components: main" >> Release
          echo "Description: A-ZAIN Repo - Jailbreak tools and utilities" >> Release

          git add -A
          git commit -m "Update repo: add IPA Installer Pro alongside existing packages" || true
          git push origin gh-pages --force
